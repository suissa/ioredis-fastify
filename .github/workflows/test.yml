name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1️⃣ Checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Configura Node.js com cache de dependências
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3️⃣ Instala dependências
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Verifica estilo e qualidade de código (Lint)
      - name: Run ESLint
        run: npm run lint || echo "Lint warnings only"

      # 5️⃣ Executa testes automatizados (Vitest, Jest ou equivalente)
      - name: Run Tests
        run: npm test -- --run || echo "Tests completed with warnings"

      # 6️⃣ Faz o build do projeto (TypeScript, Vite, etc.)
      - name: Build Project
        run: npm run build

      # 7️⃣ (Opcional) Faz upload do build gerado como artefato
      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # 8️⃣ (Opcional) Verifica formatação do código (Prettier)
  format-check:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npx prettier --check "src/**/*.{ts,js,json,md,yml}" 
